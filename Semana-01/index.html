<!DOCTYPE html>
<html lang="es">
<head>
  <title>Mi primer diseño responsivo</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
  
<div class="container-fluid mt-3">
    <div class="row">
        <div class="fw-bolder fs-1 bg-danger text-center col-12 p-5 text-white">DISEÑO RESPONSIVO</div>
    </div>

    <div class="row">
        <div class="fs-2 bg-info text-center col-12 p-3">Este es mi primer diseño responsivo</div>
    </div>
    
    <div class="row">
        <div class="bg-info text-center col-12 pb-2">Hecho con amor para Ernesto Vivanco</div>
    </div>
    
    <div class="row">
        <div class="fw-bolder bg-primary text-white col-3 p-3">Hecho con bootstrap</div>
        <div class="fw-semibold bg-secondary text-white col-6 p-3">a ultimo minuto</div>
        <div class="fw-light bg-primary text-white col-3 p-3">y con hambre</div>
    </div>

    <div class="row">
        <div class="bg-success text-white text-center col-4 p-2">Este color es para veganos</div>
        <div class="bg-dark col-4 p-2">Juju no me ves</div>
        <div class="fw-bold bg-light col-4 p-2">Negrita</div>
    </div>
    
    <div class="row">
        <div class="bg-danger text-white col-3 p-2">1</div>
        <div class="bg-info col-3 p-2">2</div>
        <div class="bg-secondary text-white col-3 p-2">3</div>
        <div class="text-white bg-dark col-3 p-2">4</div>
    </div>
    
    <div class="row">
        <div class="bg-warning text-center col-12 p-2 fw-bold">Gracias por ver</div>
    </div>
</div>

</body>
</html>
